<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productora - Eventos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .party-card {
      transition: flex 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .party-card:hover {
      flex: 2 !important; /* Expansión fuerte al hover en desktop */
    }
    .bg-zoom {
      transition: transform 0.8s ease-out;
    }
    .party-card:hover .bg-zoom {
      transform: scale(1.05);
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-white font-sans overflow-x-hidden">

  <!-- Botón Oculto/Discreto al Panel de Administración -->
  <a href="admin.html" class="fixed bottom-4 right-4 z-50 opacity-10 hover:opacity-100 transition-opacity text-white flex items-center justify-center p-2 rounded-full cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
  </a>

  <!-- HOME SCREEN: SELECTOR CON DESTACADO -->
  <section id="event-selector" class="w-full min-h-[100dvh] relative bg-black flex flex-col">
    <!-- Se llenará dinámicamente desde los archivos JS separados -->
  </section>

  <!-- SECCIÓN DE DETALLE -->
  <section id="event-details" class="hidden py-16 px-6 bg-black min-h-screen">
    <div class="max-w-6xl mx-auto">
      <button onclick="backToHome()" class="mb-8 flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-gray-400 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver al Inicio
      </button>

      <div class="text-center mb-16">
        <div id="detail-title-container" class="mb-4 drop-shadow-[0_0_20px_rgba(255,255,255,0.2)]"></div>
        <p id="detail-date" class="text-xl md:text-2xl text-gray-200 mb-2"></p>
        <p id="detail-theme" class="text-md md:text-lg text-gray-500 tracking-[0.2em] uppercase"></p>
      </div>

      <!-- CONTENEDOR PARA PREVENTAS, SORTEOS Y SPONSORS -->
      <div id="extra-details" class="w-full mb-16 space-y-16"></div>

      <!-- RED DE RRPP -->
      <h3 id="rrpp-section" class="text-2xl md:text-3xl font-black uppercase tracking-wide mb-8 text-center border-b border-white/10 pb-4">
        Vendedores Oficiales
      </h3>
      <div id="rrpp-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- RRPP dinámicos aquí -->
      </div>
    </div>
  </section>

  <!-- 1. Inicializamos el array vacío para las fiestas -->
  <script>
    window.fiestas = [];
  </script>

  <!-- 2. Importamos los archivos separados (¡Aquí puedes editarlos independientemente!) -->
  <script src="fiestas/wild-fest.js"></script>
  <script src="fiestas/geminis.js"></script>
  <script src="fiestas/70-30.js"></script>

  <!-- Lógica Principal de la Interfaz -->
  <script>
    async function initApp() {
      let events = [];
      try {
        // Intenta obtener los datos del panel de administrador
        const res = await fetch('/api/fiestas', { cache: 'no-store' });
        if (!res.ok) throw new Error('Respuesta no OK del servidor');
        events = await res.json();
      } catch (e) {
        // Fallback: Si el servidor no está corriendo, usa los archivos locales
        console.warn('Servidor admin no detectado. Usando archivos locales (fiestas/*.js)', e);
        events = window.fiestas;
        
        // Mostrar alerta en pantalla para que el usuario lo sepa
        const alertDiv = document.createElement('div');
        alertDiv.className = 'fixed top-0 left-0 w-full bg-red-600 text-white text-center py-2 z-50 font-bold';
        alertDiv.innerText = '⚠️ Modo sin conexión: Mostrando datos estáticos. Asegúrate de abrir http://localhost:3001 y tener node server.js corriendo.';
        document.body.appendChild(alertDiv);
      }

      let highlightedIndex = events.findIndex(e => e.isHighlighted);
      if (highlightedIndex === -1) highlightedIndex = 0; // Fallback al primero

      window.currentEvents = events;
      renderHomeScreen(highlightedIndex);
    }

    function renderHomeScreen(selectedIndex) {
      const events = window.currentEvents;
      const selectorContainer = document.getElementById('event-selector');
      selectorContainer.innerHTML = '';
      
      const evt = events[selectedIndex];
      
      // HERO (Fiesta Destacada)
      const eventDate = new Date(evt.date);
      const dateString = eventDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

      const customWidth = evt.logoWidth ? `width: ${evt.logoWidth};` : 'width: 16rem;'; 
      const logoHtml = evt.logo 
        ? `<img src="${evt.logo}" alt="${evt.name}" style="${customWidth} max-height: 350px; object-fit: contain;" class="drop-shadow-[0_0_15px_rgba(0,0,0,0.8)]">`
        : `<h2 class="text-4xl md:text-5xl lg:text-7xl font-black uppercase italic drop-shadow-[0_0_15px_rgba(0,0,0,0.8)]" style="color: ${evt.color}">${evt.name}</h2>`;

      const hero = document.createElement('div');
      hero.className = 'w-full min-h-[100dvh] relative flex flex-col justify-center items-center text-center p-6 pb-40';
      
      hero.innerHTML = `
        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 scale-105" style="background-image: url('${evt.image}');"></div>
        <div class="absolute inset-0 bg-black/60 z-10 backdrop-blur-[2px]"></div>
        
        <div class="relative z-20 flex flex-col justify-center items-center text-center animate-fade-in-up">
          <p class="text-xs md:text-sm font-mono tracking-[0.3em] uppercase mb-3 text-gray-300">
            ${evt.theme}
          </p>
          ${logoHtml}
          <p class="text-lg md:text-xl font-light mt-4 text-white/90 drop-shadow-md">
            ${dateString}
          </p>
          
          <button onclick="showEventDetails(${selectedIndex})" class="mt-8 px-8 py-3 rounded-full font-black text-black transition-all hover:scale-105 relative z-50 cursor-pointer pointer-events-auto shadow-2xl" style="background-color: ${evt.color}; box-shadow: 0 0 20px ${evt.color}80">
            VER MÁS E INGRESAR
          </button>
        </div>
      `;

      selectorContainer.appendChild(hero);

      // PEQUEÑO MENÚ (Otras fiestas)
      const otherEvents = events.map((e, i) => ({...e, originalIndex: i})).filter(e => e.originalIndex !== selectedIndex);
      
      if (otherEvents.length > 0) {
        const menu = document.createElement('div');
        menu.className = 'absolute bottom-8 left-0 w-full px-4 md:px-12 z-30 flex flex-col items-start pointer-events-none';
        
        let menuHtml = `<p class="text-white text-xs font-bold uppercase tracking-widest mb-3 opacity-80 pointer-events-auto drop-shadow-md">Explorar más fiestas</p>
          <div class="flex gap-4 overflow-x-auto w-full pb-4 scrollbar-hide md:scrollbar-default snap-x pointer-events-auto">`;
          
        otherEvents.forEach(other => {
          menuHtml += `
            <div onclick="renderHomeScreen(${other.originalIndex})" class="min-w-[140px] w-[140px] h-20 md:w-48 md:h-24 rounded-xl overflow-hidden relative cursor-pointer group snap-start border-2 border-transparent hover:border-white/50 transition-colors shadow-lg pointer-events-auto" style="border-color: ${other.color}40">
              <div class="absolute inset-0 bg-cover bg-center group-hover:scale-110 transition-transform duration-500" style="background-image: url('${other.image}');"></div>
              <div class="absolute inset-0 bg-black/50 group-hover:bg-black/20 transition-colors"></div>
              <div class="absolute inset-0 p-2 flex flex-col justify-end">
                <p class="text-white text-sm font-bold uppercase truncate drop-shadow-md" style="color: ${other.color}">${other.name}</p>
                <p class="text-gray-300 text-[10px] uppercase truncate drop-shadow-md">${other.theme}</p>
              </div>
            </div>
          `;
        });
        
        menuHtml += `</div>`;
        menu.innerHTML = menuHtml;
        selectorContainer.appendChild(menu);
      }
    }

    function showEventDetails(index) {
      try {
        history.pushState({ view: 'details' }, '', '#details');
        const events = window.currentEvents;
        const evt = events[index];
        
        const selector = document.getElementById('event-selector');
        const details = document.getElementById('event-details');
        
        // Forzar ocultamiento absoluto
        selector.style.display = 'none';
        details.style.display = 'block';
        details.classList.remove('hidden');
        window.scrollTo(0, 0);

        const titleContainer = document.getElementById('detail-title-container');
      
      if (evt.logo) {
        titleContainer.innerHTML = `<img src="${evt.logo}" alt="${evt.name}" class="mx-auto max-w-[15rem] md:max-w-md max-h-48 object-contain">`;
      } else {
        titleContainer.innerHTML = `<h2 class="text-5xl md:text-8xl font-black uppercase italic" style="color: ${evt.color}">${evt.name}</h2>`;
      }
      
      const eventDate = new Date(evt.date);
      document.getElementById('detail-date').innerText = eventDate.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('detail-theme').innerText = evt.theme;

      const extraContainer = document.getElementById('extra-details');
      extraContainer.innerHTML = '';
      
      // DESCRIPCION
      if (evt.description && evt.description.trim() !== '') {
        extraContainer.innerHTML += `
          <div class="text-center max-w-4xl mx-auto bg-white/5 border border-white/10 p-8 rounded-2xl shadow-xl">
            <h3 class="text-xl font-bold uppercase tracking-widest text-gray-400 mb-4">Información de la Fiesta</h3>
            <p class="text-gray-200 whitespace-pre-line leading-relaxed text-sm md:text-base">${evt.description}</p>
          </div>
        `;
      }
      
      // GALERIA
      if (evt.gallery && evt.gallery.length > 0) {
        let galleryHtml = `
          <div class="w-full">
            <h3 class="text-2xl font-black uppercase tracking-wide mb-6 text-center text-white border-b border-white/10 pb-4">Galería de Fotos</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        `;
        evt.gallery.forEach(img => {
          galleryHtml += `
            <div class="aspect-square rounded-xl overflow-hidden border border-white/10 hover:scale-105 transition-transform duration-300">
              <img src="${img}" class="w-full h-full object-cover">
            </div>
          `;
        });
        galleryHtml += `</div></div>`;
        extraContainer.innerHTML += galleryHtml;
      }
      
      // PREVENTAS
      if (evt.presales && evt.presales.length > 0) {
        let presalesHtml = `<div class="bg-[#111] border border-white/10 rounded-3xl p-8 shadow-2xl">
          <h3 class="text-2xl font-black uppercase tracking-wide mb-6 text-center text-blue-400">🎟️ Tickets y Preventas</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
        
        evt.presales.forEach(p => {
          presalesHtml += `
            <div class="bg-black border border-white/20 p-6 rounded-2xl flex flex-col items-center text-center group hover:border-blue-500 transition-colors">
              <h4 class="text-xl font-bold text-white mb-2">${p.name}</h4>
              <p class="text-3xl font-black text-blue-400 mb-4">${p.price}</p>
              <p class="text-xs text-gray-500 mb-6">Desde: ${p.startDate ? p.startDate.replace('T', ' ') : '-'} <br> Hasta: ${p.endDate ? p.endDate.replace('T', ' ') : '-'}</p>
              <button onclick="document.getElementById('rrpp-section').scrollIntoView({behavior: 'smooth'})" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] group-hover:shadow-[0_0_25px_rgba(37,99,235,0.6)]">COMPRAR AHORA</button>
            </div>
          `;
        });
        presalesHtml += `</div></div>`;
        extraContainer.innerHTML += presalesHtml;
      }

      // SORTEOS
      if (evt.raffles && evt.raffles.length > 0) {
        let rafflesHtml = `<div class="bg-gradient-to-r from-purple-900/40 to-pink-900/40 border border-purple-500/30 rounded-3xl p-8 shadow-2xl text-center">
          <h3 class="text-2xl font-black uppercase tracking-wide mb-6 text-purple-300">🎁 Sorteos Activos</h3>
          <div class="flex flex-wrap justify-center gap-6">`;
        
        evt.raffles.forEach(r => {
          rafflesHtml += `
            <div class="bg-black/50 border border-purple-500/50 p-6 rounded-2xl flex flex-col items-center max-w-md w-full">
              <h4 class="text-xl font-bold text-white mb-3">${r.title}</h4>
              <p class="text-sm text-gray-300 mb-6">${r.description}</p>
              <a href="${r.link || '#'}" target="_blank" class="px-8 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-full text-sm transition-all shadow-[0_0_15px_rgba(147,51,234,0.4)] hover:scale-105">PARTICIPAR AQUÍ</a>
            </div>
          `;
        });
        rafflesHtml += `</div></div>`;
        extraContainer.innerHTML += rafflesHtml;
      }

      // DJS (LINEUP)
      if (evt.djs && evt.djs.length > 0) {
        let djsHtml = `<div class="bg-[#111] border border-white/10 rounded-3xl p-8 shadow-2xl mt-8">
          <h3 class="text-2xl font-black uppercase tracking-wide mb-6 text-center text-white">🎧 Lineup / DJs</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
        
        evt.djs.forEach(dj => {
          let igButton = '';
          if (dj.link && dj.link.trim() !== '') {
            igButton = `<a href="${dj.link}" target="_blank" class="w-full py-3 bg-transparent border border-white/20 hover:border-white/60 text-white font-medium rounded-xl text-sm flex items-center justify-center transition-all mt-2">Instagram / SoundCloud</a>`;
          }

          let waButton = '';
          if (dj.whatsapp && dj.whatsapp.trim() !== '') {
            const textMsg = encodeURIComponent(`Hola, quiero información de la fiesta ${evt.name}`);
            const waLink = `https://wa.me/${dj.whatsapp}?text=${textMsg}`;
            waButton = `<a href="${waLink}" target="_blank" class="w-full py-3 bg-[#25D366] hover:bg-[#1ebd5a] text-black font-black rounded-xl text-sm flex items-center justify-center gap-2 transition-all transform hover:scale-105 mt-3">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"/></svg>
              WhatsApp
            </a>`;
          }

          djsHtml += `
            <div class="bg-black border border-white/20 p-6 rounded-2xl flex flex-col items-center text-center group hover:border-white/40 transition-colors shadow-xl">
              <div class="w-24 h-24 rounded-full overflow-hidden mb-4 border-2 border-transparent transition-colors duration-300 shadow-lg" style="border-color: ${evt.color}80">
                <img src="${dj.image || 'https://via.placeholder.com/150'}" alt="${dj.name}" class="w-full h-full object-cover" />
              </div>
              <h4 class="text-xl font-bold text-white mb-2">${dj.name}</h4>
              <div class="flex flex-col w-full gap-2 mt-auto">
                ${waButton}
                ${igButton}
              </div>
            </div>
          `;
        });
        djsHtml += `</div></div>`;
        extraContainer.innerHTML += djsHtml;
      }

      // SPONSORS
      if (evt.sponsors && evt.sponsors.length > 0) {
        let sponsorsHtml = `<div class="pt-8">
          <p class="text-center text-xs tracking-[0.3em] text-gray-600 uppercase mb-6">Acompañan</p>
          <div class="flex flex-wrap justify-center items-center gap-8 md:gap-16 opacity-60 hover:opacity-100 transition-opacity">`;
        
        evt.sponsors.forEach(s => {
          sponsorsHtml += `
            <img src="${s.logo}" alt="${s.name}" class="h-12 md:h-16 object-contain grayscale hover:grayscale-0 transition-all duration-500" title="${s.name}">
          `;
        });
        sponsorsHtml += `</div></div>`;
        extraContainer.innerHTML += sponsorsHtml;
      }

      const grid = document.getElementById('rrpp-grid');
      grid.innerHTML = '';
      
      if(!evt.prNetwork || evt.prNetwork.length === 0) {
         grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">Próximamente se anunciarán los vendedores oficiales.</p>';
      } else {
        evt.prNetwork.forEach(pr => {
          // Mensaje personalizado solicitado
          const textMsg = encodeURIComponent(`Hola, quiero información de la fiesta ${evt.name}`);
          const waLink = `https://wa.me/${pr.phone}?text=${textMsg}`;
          
          // Botón de Instagram condicional
          let igButton = '';
          if (pr.instagram && pr.instagram.trim() !== '') {
            igButton = `<a href="${pr.instagram}" target="_blank" class="w-full py-3 bg-transparent border border-white/20 hover:border-white/60 text-white font-medium rounded-xl text-sm flex items-center justify-center transition-all">Instagram</a>`;
          }

          grid.innerHTML += `
            <div class="bg-[#0a0a0a] rounded-2xl overflow-hidden border border-white/10 hover:border-white/30 transition-all flex flex-col items-center p-8 text-center group shadow-xl">
              <div class="w-24 h-24 rounded-full overflow-hidden mb-4 border-2 border-transparent transition-colors duration-300 shadow-lg" style="border-color: ${evt.color}80">
                <img src="${pr.image || 'https://via.placeholder.com/150'}" alt="${pr.name}" class="w-full h-full object-cover" />
              </div>
              <h3 class="text-xl font-bold text-white mb-1">${pr.name}</h3>
              <p class="text-xs uppercase tracking-widest mb-6 px-3 py-1 rounded-md" style="color: ${evt.color}; background-color: ${evt.color}15; border: 1px solid ${evt.color}30">
                📍 ${pr.zone}
              </p>
              <div class="flex flex-col w-full gap-3 mt-auto">
                <a href="${waLink}" target="_blank" class="w-full py-3 bg-[#25D366] hover:bg-[#1ebd5a] text-black font-black rounded-xl text-sm flex items-center justify-center gap-2 transition-all transform hover:scale-105">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"/></svg>
                  WhatsApp
                </a>
                ${igButton}
              </div>
            </div>
          `;
        });
      }
      } catch(e) {
        alert("Ocurrió un error al cargar los detalles: " + e.message);
        console.error(e);
      }
    }

    function backToHome() {
      if (window.location.hash === '#details') {
        history.back();
      } else {
        showHomeUI();
      }
    }

    function showHomeUI() {
      const selector = document.getElementById('event-selector');
      const details = document.getElementById('event-details');
      
      details.style.display = 'none';
      selector.style.display = 'flex';
      window.scrollTo(0, 0);
    }

    window.addEventListener('popstate', (e) => {
      if (window.location.hash !== '#details') {
        showHomeUI();
      }
    });

    // Iniciar aplicación
    initApp();
  </script>
</body>
</html>
